# Local stack: PostgreSQL, Redis, Mailpit (catches emails) and the app.
#   docker compose up --build        -> http://localhost:4000, mail UI on :8025
#   docker compose up -d postgres redis   (just the databases, for npm test)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booknow
      POSTGRES_PASSWORD: booknow
      POSTGRES_DB: booknow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booknow"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

  app:
    build: .
    environment:
      DATABASE_URL: postgres://booknow:booknow@postgres:5432/booknow
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:4000
      PORT: "4000"
      SESSION_SECRET: local-dev-secret-change-me
      ADMIN_TOKEN: local-admin-token
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
