# Render blueprint: one free Docker web service.
#
# Deploy: the "Deploy to Render" button in the README, or in the Render
# dashboard New > Blueprint and pick this repo.
#
# No managed database here on purpose: Render's free Postgres expires after 30
# days, which would quietly break the demo. With DATABASE_URL and REDIS_URL
# unset, the container runs its own PostgreSQL and Redis (docker/entrypoint.sh);
# data resets on each restart, which suits a public demo. For durable storage,
# add DATABASE_URL (e.g. a free Neon database) and REDIS_URL (e.g. Upstash or a
# Render Key Value instance) in the dashboard. No code change needed.
#
# Optional: STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET (test mode) switch the
# built-in mock checkout to real Stripe Checkout.
#
# Free web services sleep after 15 minutes idle and take about a minute to
# wake. Expected for a free portfolio demo.

services:
  - type: web
    name: booknow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
